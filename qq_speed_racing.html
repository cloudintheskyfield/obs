<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ飞车 - 极速漂移</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .hud-item {
            background: linear-gradient(135deg, rgba(255,107,53,0.9) 0%, rgba(192,57,43,0.9) 100%);
            padding: 12px 24px;
            border-radius: 25px;
            color: #fff;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            box-shadow: 0 4px 15px rgba(255,107,53,0.4);
            border: 2px solid rgba(255,255,255,0.3);
        }
        
        .hud-item.speed {
            background: linear-gradient(135deg, rgba(52,152,219,0.9) 0%, rgba(41,128,185,0.9) 100%);
            box-shadow: 0 4px 15px rgba(52,152,219,0.4);
        }
        
        .hud-item.lap {
            background: linear-gradient(135deg, rgba(155,89,182,0.9) 0%, rgba(142,68,173,0.9) 100%);
            box-shadow: 0 4px 15px rgba(155,89,182,0.4);
        }
        
        #speedometer {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 180px;
            height: 180px;
        }
        
        #start-screen, #game-over-screen, #pause-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(26,10,46,0.95) 100%);
            z-index: 100;
            pointer-events: auto;
        }
        
        #game-over-screen, #pause-screen {
            display: none;
        }
        
        .game-title {
            font-size: 72px;
            font-weight: bold;
            color: #ff6b35;
            text-shadow: 0 0 30px rgba(255,107,53,0.6), 4px 4px 8px rgba(0,0,0,0.8);
            margin-bottom: 10px;
            letter-spacing: 8px;
        }
        
        .game-subtitle {
            font-size: 28px;
            color: #ffd700;
            margin-bottom: 50px;
            text-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        
        .menu-btn {
            padding: 18px 70px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #ff6b35 0%, #e74c3c 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(255,107,53,0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 10px;
        }
        
        .menu-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 35px rgba(255,107,53,0.7);
        }
        
        .menu-btn.secondary {
            background: linear-gradient(180deg, #3498db 0%, #2980b9 100%);
            box-shadow: 0 6px 25px rgba(52,152,219,0.5);
        }
        
        .menu-btn.secondary:hover {
            box-shadow: 0 8px 35px rgba(52,152,219,0.7);
        }
        
        .controls-panel {
            margin-top: 40px;
            padding: 25px 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .controls-panel h3 {
            color: #87ceeb;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .controls-panel p {
            color: #ccc;
            margin: 8px 0;
            font-size: 16px;
        }
        
        .controls-panel kbd {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255,255,255,0.15);
            border-radius: 5px;
            margin: 0 5px;
            font-family: monospace;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        #final-result {
            font-size: 52px;
            color: #ffd700;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        
        #final-time {
            font-size: 36px;
            color: #fff;
            margin-bottom: 30px;
        }
        
        #rank-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 40px rgba(255,215,0,0.8);
            display: none;
            z-index: 150;
        }
        
        .boost-indicator {
            position: absolute;
            bottom: 220px;
            right: 50px;
            width: 30px;
            height: 150px;
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.3);
            overflow: hidden;
        }
        
        #boost-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #ffd700 0%, #ff6b35 100%);
            transition: height 0.1s;
        }
        
        .boost-label {
            position: absolute;
            bottom: 380px;
            right: 35px;
            color: #ffd700;
            font-size: 14px;
            font-weight: bold;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 28px;
            z-index: 50;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-overlay">
            <div id="hud">
                <div class="hud-item">🏁 圈数: <span id="lap-count">0/3</span></div>
                <div class="hud-item speed">⚡ 速度: <span id="speed-display">0</span> km/h</div>
                <div class="hud-item lap">⏱️ 时间: <span id="time-display">00:00.00</span></div>
            </div>
            
            <canvas id="speedometer"></canvas>
            
            <div class="boost-label">N2O</div>
            <div class="boost-indicator">
                <div id="boost-fill"></div>
            </div>
            
            <div id="start-screen">
                <div class="game-title">QQ飞车</div>
                <div class="game-subtitle">极速漂移</div>
                <button class="menu-btn" id="start-btn">开始游戏</button>
                <button class="menu-btn secondary" id="practice-btn">练习模式</button>
                
                <div class="controls-panel">
                    <h3>🎮 操作说明</h3>
                    <p><kbd>↑</kbd> 加速 | <kbd>↓</kbd> 刹车/倒车</p>
                    <p><kbd>←</kbd> 左转 | <kbd>→</kbd> 右转</p>
                    <p><kbd>空格</kbd> 漂移 | <kbd>Shift</kbd> 氮气加速</p>
                </div>
            </div>
            
            <div id="game-over-screen">
                <div class="game-title" style="font-size: 56px;">比赛结束</div>
                <div id="final-result">S</div>
                <div id="final-time">00:00.00</div>
                <button class="menu-btn" id="restart-btn">再来一局</button>
                <button class="menu-btn secondary" id="menu-btn">返回菜单</button>
            </div>
            
            <div id="pause-screen">
                <div class="game-title" style="font-size: 48px;">已暂停</div>
                <button class="menu-btn" id="resume-btn">继续游戏</button>
                <button class="menu-btn secondary" id="quit-btn">退出比赛</button>
            </div>
            
            <div id="rank-display"></div>
        </div>
        
        <div id="loading">
            <div class="loading-spinner"></div>
            <div>加载资源中...</div>
        </div>
    </div>
    
    <script>
        // ==================== GAME CONFIGURATION ====================
        const CONFIG = {
            canvasWidth: window.innerWidth,
            canvasHeight: window.innerHeight,
            roadWidth: 400,
            laneCount: 4,
            maxSpeed: 280,
            acceleration: 150,
            deceleration: 80,
            brakeDeceleration: 200,
            turnSpeed: 180,
            driftTurnSpeed: 280,
            friction: 0.98,
            roadFriction: 0.95,
            boostMultiplier: 1.8,
            boostDuration: 2000,
            boostRechargeRate: 0.3,
            lapCount: 3,
            checkpointCount: 4
        };
        
        // ==================== GAME STATE ====================
        let gameState = 'loading';
        let canvas, ctx, speedCanvas, speedCtx;
        let car, road, particles, obstacles;
        let currentSpeed = 0;
        let distanceTraveled = 0;
        let raceTime = 0;
        let currentLap = 0;
        let lastCheckpoint = -1;
        let boostAmount = 100;
        let isBoosting = false;
        let isDrifting = false;
        let driftAngle = 0;
        let keys = {};
        let lastTime = 0;
        let checkpoints = [];
        
        // ==================== DOM ELEMENTS ====================
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const pauseScreen = document.getElementById('pause-screen');
        const lapDisplay = document.getElementById('lap-count');
        const speedDisplay = document.getElementById('speed-display');
        const timeDisplay = document.getElementById('time-display');
        const boostFill = document.getElementById('boost-fill');
        const finalResult = document.getElementById('final-result');
        const finalTime = document.getElementById('final-time');
        const rankDisplay = document.getElementById('rank-display');
        const loadingDisplay = document.getElementById('loading');
        
        // ==================== INITIALIZATION ====================
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            speedCanvas = document.getElementById('speedometer');
            speedCtx = speedCanvas.getContext('2d');
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Initialize game objects
            initCar();
            initRoad();
            initParticles();
            initCheckpoints();
            
            // Event listeners
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);
            
            document.getElementById('start-btn').addEventListener('click', () => startGame(false));
            document.getElementById('practice-btn').addEventListener('click', () => startGame(true));
            document.getElementById('restart-btn').addEventListener('click', restartGame);
            document.getElementById('menu-btn').addEventListener('click', returnToMenu);
            document.getElementById('resume-btn').addEventListener('click', resumeGame);
            document.getElementById('quit-btn').addEventListener('click', returnToMenu);
            
            // Hide loading
            loadingDisplay.style.display = 'none';
            gameState = 'menu';
            
            // Start render loop
            requestAnimationFrame(gameLoop);
        }
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            CONFIG.canvasWidth = canvas.width;
            CONFIG.canvasHeight = canvas.height;
            
            speedCanvas.width = 180;
            speedCanvas.height = 180;
        }
        
        // ==================== GAME OBJECTS ====================
        function initCar() {
            car = {
                x: CONFIG.canvasWidth / 2,
                y: CONFIG.canvasHeight * 0.7,
                width: 60,
                height: 100,
                angle: 0,
                color: '#ff6b35',
                wheelAngle: 0,
                driftParticles: []
            };
        }
        
        function initRoad() {
            road = {
                segments: [],
                scrollOffset: 0,
                segmentLength: 200,
                visibleSegments: Math.ceil(CONFIG.canvasHeight / 200) + 2
            };
            
            // Generate initial road segments
            for (let i = 0; i < road.visibleSegments; i++) {
                road.segments.push({
                    y: CONFIG.canvasHeight - i * road.segmentLength,
                    curvature: 0,
                    width: CONFIG.roadWidth,
                    color: i % 2 === 0 ? '#3d3d3d' : '#454545',
                    markers: generateLaneMarkers()
                });
            }
        }
        
        function generateLaneMarkers() {
            const markers = [];
            const laneWidth = CONFIG.roadWidth / CONFIG.laneCount;
            for (let i = 1; i < CONFIG.laneCount; i++) {
                markers.push({
                    x: -CONFIG.roadWidth/2 + i * laneWidth,
                    type: i === 2 ? 'solid' : 'dashed' // Different marker types
                });
            }
            return markers;
        }
        
        function initParticles() {
            particles = [];
            obstacles = [];
        }
        
        function initCheckpoints() {
            const trackLength = CONFIG.lapCount * CONFIG.segmentLength * road.visibleSegments * 2;
            for (let i = 0; i < CONFIG.checkpointCount; i++) {
                checkpoints.push({
                    position: (i + 1) * (trackLength / CONFIG.checkpointCount),
                    passed: false
                });
            }
        }
        
        // ==================== INPUT HANDLING ====================
        function handleKeyDown(e) {
            keys[e.key] = true;
            keys[e.code] = true;
            
            if (e.key === 'Escape' && gameState === 'playing') {
                pauseGame();
            }
            
            // Boost
            if ((e.key === 'Shift' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && 
                boostAmount > 10 && !isBoosting && gameState === 'playing') {
                isBoosting = true;
                setTimeout(() => { isBoosting = false; }, CONFIG.boostDuration);
            }
            
            // Drift
            if (e.key === ' ' && currentSpeed > 50 && gameState === 'playing') {
                isDrifting = true;
            }
        }
        
        function handleKeyUp(e) {
            keys[e.key] = false;
            keys[e.code] = false;
            
            if (e.key === ' ') {
                isDrifting = false;
                driftAngle = 0;
            }
        }
        
        // ==================== GAME LOGIC ====================
        function startGame(isPractice) {
            gameState = 'playing';
            currentSpeed = 0;
            distanceTraveled = 0;
            raceTime = 0;
            currentLap = 0;
            lastCheckpoint = -1;
            boostAmount = 100;
            isBoosting = false;
            isDrifting = false;
            
            CONFIG.lapCount = isPractice ? 999 : 3;
            
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            pauseScreen.style.display = 'none';
            
            lastTime = performance.now();
        }
        
        function restartGame() {
            startGame(false);
        }
        
        function returnToMenu() {
            gameState = 'menu';
            startScreen.style.display = 'flex';
            gameOverScreen.style.display = 'none';
            pauseScreen.style.display = 'none';
        }
        
        function pauseGame() {
            gameState = 'paused';
            pauseScreen.style.display = 'flex';
        }
        
        function resumeGame() {
            gameState = 'playing';
            pauseScreen.style.display = 'none';
            lastTime = performance.now();
        }
        
        function endGame() {
            gameState = 'gameover';
            
            const rank = calculateRank();
            finalResult.textContent = rank;
            finalTime.textContent = formatTime(raceTime);
            
            // Show rank animation
            rankDisplay.style.display = 'block';
            rankDisplay.style.opacity = '0';
            rankDisplay.style.transform = 'translate(-50%, -50%) scale(0.5)';
            
            let opacity = 0;
            let scale = 0.5;
            const animateRank = setInterval(() => {
                opacity += 0.05;
                scale += 0.05;
                rankDisplay.style.opacity = opacity;
                rankDisplay.style.transform = `translate(-50%, -50%) scale(${scale})`;
                if (opacity >= 1) clearInterval(animateRank);
            }, 30);
            
            setTimeout(() => {
                rankDisplay.style.display = 'none';
                gameOverScreen.style.display = 'flex';
            }, 2000);
        }
        
        function calculateRank() {
            const baseTime = 60; // seconds for S rank
            const time = raceTime / 1000;
            const speedBonus = (currentSpeed / CONFIG.maxSpeed) * 10;
            const driftBonus = isDrifting ? 5 : 0;
            
            const score = (baseTime / time) * 100 + speedBonus + driftBonus;
            
            if (score >= 150) return 'S';
            if (score >= 120) return 'A';
            if (score >= 100) return 'B';
            if (score >= 80) return 'C';
            return 'D';
        }
        
        // ==================== UPDATE LOOP ====================
        function update(deltaTime) {
            if (gameState !== 'playing') return;
            
            raceTime += deltaTime;
            
            // Acceleration / Deceleration
            let acceleration = CONFIG.acceleration;
            if (isBoosting && boostAmount > 0) {
                acceleration *= CONFIG.boostMultiplier;
                boostAmount -= deltaTime * 5;
            } else {
                isBoosting = false;
                if (boostAmount < 100) {
                    boostAmount += CONFIG.boostRechargeRate * deltaTime;
                }
            }
            
            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                currentSpeed += acceleration * deltaTime;
            } else if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                currentSpeed -= CONFIG.brakeDeceleration * deltaTime;
            } else {
                currentSpeed -= CONFIG.deceleration * deltaTime;
            }
            
            // Apply friction
            currentSpeed *= isDrifting ? CONFIG.roadFriction : CONFIG.friction;
            currentSpeed = Math.max(0, Math.min(currentSpeed, CONFIG.maxSpeed));
            
            // Steering
            let turnSpeed = isDrifting ? CONFIG.driftTurnSpeed : CONFIG.turnSpeed;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                car.angle -= turnSpeed * deltaTime;
                car.wheelAngle = Math.max(car.wheelAngle - 5, -30);
            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                car.angle += turnSpeed * deltaTime;
                car.wheelAngle = Math.min(car.wheelAngle + 5, 30);
            } else {
                car.wheelAngle *= 0.9;
            }
            
            // Drift angle
            if (isDrifting) {
                driftAngle = Math.max(driftAngle - 100 * deltaTime, -0.4);
                // Create drift particles
                if (Math.random() < 0.5) {
                    createDriftParticle();
                }
            } else {
                driftAngle *= 0.9;
            }
            
            // Move car based on speed
            const moveX = Math.sin(car.angle + driftAngle) * currentSpeed * deltaTime * 0.1;
            car.x += moveX;
            
            // Road boundaries
            const roadLeft = CONFIG.canvasWidth / 2 - CONFIG.roadWidth / 2 + 30;
            const roadRight = CONFIG.canvasWidth / 2 + CONFIG.roadWidth / 2 - 30;
            car.x = Math.max(roadLeft, Math.min(roadRight, car.x));
            
            // Update road scroll
            road.scrollOffset += currentSpeed * deltaTime * 0.5;
            if (road.scrollOffset > road.segmentLength) {
                road.scrollOffset -= road.segmentLength;
                // Add new road segment with procedural generation
                addRoadSegment();
            }
            
            // Update distance
            distanceTraveled += currentSpeed * deltaTime * 0.1;
            
            // Update checkpoints
            updateCheckpoints();
            
            // Update particles
            updateParticles(deltaTime);
            
            // Update UI
            updateUI();
        }
        
        function addRoadSegment() {
            const lastSegment = road.segments[road.segments.length - 1];
            const newCurvature = (Math.random() - 0.5) * 2;
            
            road.segments.push({
                y: lastSegment.y - road.segmentLength,
                curvature: lastSegment.curvature * 0.95 + newCurvature * 0.05,
                width: CONFIG.roadWidth,
                color: Math.random() > 0.5 ? '#3d3d3d' : '#454545',
                markers: generateLaneMarkers()
            });
            
            // Remove old segment
            if (road.segments.length > road.visibleSegments) {
                road.segments.shift();
            }
        }
        
        function updateCheckpoints() {
            // Simple lap system based on distance
            const trackLength = 10000;
            const lapDistance = trackLength;
            
            const newLap = Math.floor(distanceTraveled / lapDistance);
            if (newLap > currentLap) {
                currentLap = newLap;
                if (currentLap >= CONFIG.lapCount) {
                    endGame();
                }
            }
        }
        
        function createDriftParticle() {
            const side = Math.random() > 0.5 ? 1 : -1;
            particles.push({
                x: car.x + side * 20,
                y: car.y + 40,
                vx: (Math.random() - 0.5) * 100,
                vy: -Math.random() * 50 - 20,
                size: Math.random() * 8 + 4,
                life: 1,
                color: Math.random() > 0.5 ? '#888' : '#666',
                type: 'smoke'
            });
        }
        
        function createBoostParticle() {
            particles.push({
                x: car.x + (Math.random() - 0.5) * 30,
                y: car.y + 60,
                vx: (Math.random() - 0.5) * 50,
                vy: Math.random() * 100 + 50,
                size: Math.random() * 15 + 8,
                life: 1,
                color: Math.random() > 0.5 ? '#ff6b35' : '#ffd700',
                type: 'fire'
            });
        }
        
        function updateParticles(deltaTime) {
            // Create boost particles
            if (isBoosting && Math.random() < 0.3) {
                createBoostParticle();
            }
            
            // Update all particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * deltaTime;
                p.y += p.vy * deltaTime;
                p.life -= deltaTime * 2;
                p.size *= 0.98;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        function updateUI() {
            lapDisplay.textContent = `${Math.min(currentLap + 1, CONFIG.lapCount)}/${CONFIG.lapCount}`;
            speedDisplay.textContent = Math.floor(currentSpeed);
            timeDisplay.textContent = formatTime(raceTime);
            boostFill.style.height = `${boostAmount}%`;
        }
        
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const centiseconds = Math.floor((ms % 1000) / 10);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
        }
        
        // ==================== RENDERING ====================
        function render() {
            // Clear canvas
            ctx.fillStyle = '#1a0a2e';
            ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
            
            // Draw background (sky with stars)
            drawBackground();
            
            // Draw road
            drawRoad();
            
            // Draw particles (behind car)
            drawParticles();
            
            // Draw car
            drawCar();
            
            // Draw speedometer
            drawSpeedometer();
        }
        
        function drawBackground() {
            // Gradient sky
            const gradient = ctx.createLinearGradient(0, 0, 0, CONFIG.canvasHeight);
            gradient.addColorStop(0, '#0a0a1a');
            gradient.addColorStop(0.5, '#1a0a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
            
            // Stars
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 50; i++) {
                const x = (i * 137 + road.scrollOffset * 0.1) % CONFIG.canvasWidth;
                const y = (i * 89) % (CONFIG.canvasHeight * 0.4);
                const size = (i % 3) + 1;
                ctx.globalAlpha = 0.3 + (i % 5) * 0.1;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // Distant mountains
            ctx.fillStyle = '#1a1a3a';
            ctx.beginPath();
            ctx.moveTo(0, CONFIG.canvasHeight * 0.5);
            for (let x = 0; x <= CONFIG.canvasWidth; x += 50) {
                const y = CONFIG.canvasHeight * 0.5 - Math.sin(x * 0.01 + road.scrollOffset * 0.02) * 50;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(CONFIG.canvasWidth, CONFIG.canvasHeight);
            ctx.lineTo(0, CONFIG.canvasHeight);
            ctx.fill();
        }
        
        function drawRoad() {
            const centerX = CONFIG.canvasWidth / 2;
            
            road.segments.forEach((segment, index) => {
                const y = segment.y + road.scrollOffset;
                if (y < -road.segmentLength || y > CONFIG.canvasHeight + road.segmentLength) return;
                
                // Calculate perspective
                const perspective = 1 + (y / CONFIG.canvasHeight) * 2;
                const width = segment.width * perspective;
                const x = centerX - width / 2 + (segment.curvature * (1 - perspective) * 50);
                
                // Draw road surface
                ctx.fillStyle = segment.color;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + width, y);
                ctx.lineTo(x + width + 50, y + road.segmentLength);
                ctx.lineTo(x - 50, y + road.segmentLength);
                ctx.fill();
                
                // Draw road edge lines
                ctx.strokeStyle = '#ff6b35';
                ctx.lineWidth = 4 * perspective;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x - 50, y + road.segmentLength);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + width, y);
                ctx.lineTo(x + width + 50, y + road.segmentLength);
                ctx.stroke();
                
                // Draw lane markers
                segment.markers.forEach(marker => {
                    if (marker.type === 'dashed') {
                        ctx.strokeStyle = '#ffd700';
                        ctx.lineWidth = 2 * perspective;
                        ctx.setLineDash([20 * perspective, 30 * perspective]);
                        ctx.beginPath();
                        ctx.moveTo(centerX + marker.x * perspective + segment.curvature * 20, y);
                        ctx.lineTo(centerX + marker.x * perspective + segment.curvature * 20, y + road.segmentLength);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    } else {
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 3 * perspective;
                        ctx.beginPath();
                        ctx.moveTo(centerX + marker.x * perspective + segment.curvature * 20, y);
                        ctx.lineTo(centerX + marker.x * perspective + segment.curvature * 20, y + road.segmentLength);
                        ctx.stroke();
                    }
                });
            });
            
            // Draw finish line when approaching
            if (currentLap < CONFIG.lapCount - 1) {
                const progress = (distanceTraveled % 10000) / 10000;
                if (progress > 0.95) {
                    const finishY = CONFIG.canvasHeight * 0.5 + (1 - progress) * 1000;
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(centerX - CONFIG.roadWidth/2, finishY, CONFIG.roadWidth, 20);
                    
                    // Checkered pattern
                    for (let i = 0; i < CONFIG.laneCount; i++) {
                        for (let j = 0; j < 4; j++) {
                            ctx.fillStyle = (i + j) % 2 === 0 ? '#000' : '#fff';
                            ctx.fillRect(
                                centerX - CONFIG.roadWidth/2 + i * (CONFIG.roadWidth/CONFIG.laneCount),
                                finishY + j * 5,
                                CONFIG.roadWidth/CONFIG.laneCount,
                                5
                            );
                        }
                    }
                }
            }
        }
        
        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y);
            
            // Apply car rotation with drift
            ctx.rotate(car.angle + driftAngle * 0.5);
            
            // Car shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(5, 45, 35, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Car body
            const gradient = ctx.createLinearGradient(-30, 0, 30, 0);
            gradient.addColorStop(0, '#cc4422');
            gradient.addColorStop(0.5, car.color);
            gradient.addColorStop(1, '#cc4422');
            ctx.fillStyle = gradient;
            
            // Main body
            ctx.beginPath();
            ctx.moveTo(-25, 40);
            ctx.lineTo(-30, 20);
            ctx.lineTo(-25, 0);
            ctx.lineTo(-20, -30);
            ctx.lineTo(20, -30);
            ctx.lineTo(25, 0);
            ctx.lineTo(30, 20);
            ctx.lineTo(25, 40);
            ctx.closePath();
            ctx.fill();
            
            // Car roof/cabin
            ctx.fillStyle = '#2244aa';
            ctx.beginPath();
            ctx.moveTo(-18, -25);
            ctx.lineTo(-15, -10);
            ctx.lineTo(15, -10);
            ctx.lineTo(18, -25);
            ctx.closePath();
            ctx.fill();
            
            // Windows
            ctx.fillStyle = '#88ccff';
            ctx.beginPath();
            ctx.moveTo(-14, -23);
            ctx.lineTo(-12, -12);
            ctx.lineTo(12, -12);
            ctx.lineTo(14, -23);
            ctx.closePath();
            ctx.fill();
            
            // Headlights
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.ellipse(-18, 35, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(18, 35, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Tail lights
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.ellipse(-20, 40, 4, 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(20, 40, 4, 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Wheels
            ctx.fillStyle = '#222';
            // Front wheels
            ctx.fillRect(-32, -15, 8, 20);
            ctx.fillRect(24, -15, 8, 20);
            // Rear wheels
            ctx.fillRect(-32, 20, 8, 20);
            ctx.fillRect(24, 20, 8, 20);
            
            // Wheel shine
            ctx.fillStyle = '#444';
            ctx.fillRect(-30, -13, 4, 16);
            ctx.fillRect(26, -13, 4, 16);
            ctx.fillRect(-30, 22, 4, 16);
            ctx.fillRect(26, 22, 4, 16);
            
            // Drift sparks
            if (isDrifting && currentSpeed > 50) {
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.arc(-35, 35, 5 + Math.random() * 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(35, 35, 5 + Math.random() * 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Boost flames
            if (isBoosting) {
                const flameLength = 30 + Math.random() * 20;
                const gradient = ctx.createLinearGradient(0, 45, 0, 45 + flameLength);
                gradient.addColorStop(0, '#fff');
                gradient.addColorStop(0.3, '#ffff00');
                gradient.addColorStop(0.6, '#ff6600');
                gradient.addColorStop(1, 'rgba(255,0,0,0)');
                ctx.fillStyle = gradient;
                
                ctx.beginPath();
                ctx.moveTo(-10, 45);
                ctx.lineTo(0, 45 + flameLength);
                ctx.lineTo(10, 45);
                ctx.closePath();
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                
                if (p.type === 'smoke') {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'fire') {
                    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                    gradient.addColorStop(0, '#fff');
                    gradient.addColorStop(0.4, p.color);
                    gradient.addColorStop(1, 'rgba(255,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            ctx.globalAlpha = 1;
        }
        
        function drawSpeedometer() {
            const cx = 90;
            const cy = 90;
            const radius = 70;
            
            // Background
            speedCtx.clearRect(0, 0, 180, 180);
            speedCtx.fillStyle = 'rgba(0,0,0,0.5)';
            speedCtx.beginPath();
            speedCtx.arc(cx, cy, radius + 10, 0, Math.PI * 2);
            speedCtx.fill();
            
            // Outer ring
            const gradient = speedCtx.createRadialGradient(cx, cy, radius - 10, cx, cy, radius + 10);
            gradient.addColorStop(0, '#333');
            gradient.addColorStop(1, '#666');
            speedCtx.strokeStyle = gradient;
            speedCtx.lineWidth = 8;
            speedCtx.beginPath();
            speedCtx.arc(cx, cy, radius, 0, Math.PI * 2);
            speedCtx.stroke();
            
            // Speed arc background
            speedCtx.strokeStyle = '#333';
            speedCtx.lineWidth = 12;
            speedCtx.beginPath();
            speedCtx.arc(cx, cy, radius - 15, Math.PI * 0.75, Math.PI * 2.25);
            speedCtx.stroke();
            
            // Speed arc
            const speedRatio = currentSpeed / CONFIG.maxSpeed;
            const endAngle = Math.PI * 0.75 + speedRatio * Math.PI * 1.5;
            
            const arcGradient = speedCtx.createLinearGradient(0, 180, 180, 0);
            arcGradient.addColorStop(0, '#27ae60');
            arcGradient.addColorStop(0.5, '#f1c40f');
            arcGradient.addColorStop(1, '#e74c3c');
            speedCtx.strokeStyle = arcGradient;
            speedCtx.lineWidth = 12;
            speedCtx.lineCap = 'round';
            speedCtx.beginPath();
            speedCtx.arc(cx, cy, radius - 15, Math.PI * 0.75, endAngle);
            speedCtx.stroke();
            
            // Speed numbers
            speedCtx.fillStyle = '#fff';
            speedCtx.font = '10px Arial';
            speedCtx.textAlign = 'center';
            for (let i = 0; i <= 7; i++) {
                const angle = Math.PI * 0.75 + (i / 7) * Math.PI * 1.5;
                const x = cx + Math.cos(angle) * (radius - 28);
                const y = cy + Math.sin(angle) * (radius - 28);
                speedCtx.fillText(i * 40, x, y + 4);
            }
            
            // Needle
            const needleAngle = Math.PI * 0.75 + speedRatio * Math.PI * 1.5;
            speedCtx.save();
            speedCtx.translate(cx, cy);
            speedCtx.rotate(needleAngle);
            speedCtx.fillStyle = '#ff6b35';
            speedCtx.beginPath();
            speedCtx.moveTo(-3, 0);
            speedCtx.lineTo(0, -radius + 20);
            speedCtx.lineTo(3, 0);
            speedCtx.closePath();
            speedCtx.fill();
            speedCtx.restore();
            
            // Center circle
            speedCtx.fillStyle = '#222';
            speedCtx.beginPath();
            speedCtx.arc(cx, cy, 8, 0, Math.PI * 2);
            speedCtx.fill();
            
            // Speed text
            speedCtx.fillStyle = '#fff';
            speedCtx.font = 'bold 20px Arial';
            speedCtx.textAlign = 'center';
            speedCtx.fillText(Math.floor(currentSpeed), cx, cy + 45);
            speedCtx.font = '10px Arial';
            speedCtx.fillText('KM/H', cx, cy + 58);
            
            // Boost indicator
            if (isBoosting) {
                speedCtx.fillStyle = '#ffd700';
                speedCtx.font = 'bold 14px Arial';
                speedCtx.fillText('N2O', cx, cy - 20);
            }
        }
        
        // ==================== GAME LOOP ====================
        function gameLoop(currentTime) {
            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            if (gameState === 'playing') {
                update(deltaTime);
            }
            
            render();
            requestAnimationFrame(gameLoop);
        }
        
        // ==================== START ====================
        window.onload = init;
    </script>
</body>
